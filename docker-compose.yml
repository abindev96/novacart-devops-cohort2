name: novacart

services:


  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-novacart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-novacart_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-novacart}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s


  backend:
    build:
      context: ./novacart/backend

    image: novacart-backend:${NOVACART_TAG:-local}

    restart: unless-stopped

    environment:
      DATABASE_URL: ${DB_DRIVER_SCHEME:-postgresql}://${POSTGRES_USER:-novacart}:${POSTGRES_PASSWORD:-novacart_local_only}@db:5432/${POSTGRES_DB:-novacart}
      APP_ENV: ${APP_ENV:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-info}

    depends_on:
      db:
        condition: service_healthy
        restart: true

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=2)"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s



 
  frontend:
    build:
      context: ./novacart/frontend

    image: novacart-frontend:${NOVACART_TAG:-local}

    restart: unless-stopped


    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "80:80"

 



volumes:
  postgres-data: