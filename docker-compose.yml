name: novacart

services:

  # ------------------------------------------------------------------
  # PostgreSQL database
  # ------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-novacart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-novacart_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-novacart}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

    # PostgreSQL is intentionally NOT published to the host.
    # Backend reaches it through the Compose service name: db:5432


  # ------------------------------------------------------------------
  # FastAPI backend
  # ------------------------------------------------------------------
  backend:
    build:
      context: ./novacart/backend

    image: novacart-backend:${NOVACART_TAG:-local}

    restart: unless-stopped

    environment:
      DATABASE_URL: ${DB_DRIVER_SCHEME:-postgresql}://${POSTGRES_USER:-novacart}:${POSTGRES_PASSWORD:-novacart_local_only}@db:5432/${POSTGRES_DB:-novacart}
      APP_ENV: ${APP_ENV:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-info}

    depends_on:
      db:
        condition: service_healthy
        restart: true

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

    # Backend is intentionally NOT published to the host.
    # Frontend reaches it through: http://backend:8000


  # ------------------------------------------------------------------
  # Frontend - Nginx + static application
  # ------------------------------------------------------------------
  frontend:
    build:
      context: ./novacart/frontend

    image: novacart-frontend:${NOVACART_TAG:-local}

    restart: unless-stopped

    environment:
      BACKEND_URL: http://backend:8000

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8080}:8080"

    # Nginx is inside the frontend image.
    # Only frontend is published to the host.


# --------------------------------------------------------------------
# Persistent storage
# --------------------------------------------------------------------
volumes:
  postgres-data: