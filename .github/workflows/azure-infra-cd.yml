
name: Azure Infrastructure CD

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/azure/**"
      - ".github/workflows/azure-infra-cd.yml"

  push:
    branches: [main]
    paths:
      - "infra/azure/**"
      - ".github/workflows/azure-infra-cd.yml"

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  validate:
    name: Terraform Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/azure

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - run: terraform fmt -check -recursive

      - run: terraform init -backend=false -input=false

      - run: terraform validate

  detect:
    name: Detect Environments
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.detect.outputs.environments }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Changed Environments
        id: detect
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE"
          else
            base="$BEFORE"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi

          mapfile -t changed < <(git diff --name-only "$base" "$GITHUB_SHA")

          shared=false
          declare -A selected=()

          for file in "${changed[@]}"; do
            if [[ "$file" == infra/azure/environments/* ]]; then
              rest="${file#infra/azure/environments/}"
              env_name="${rest%%/*}"
              selected["$env_name"]=1
            elif [[ "$file" == infra/azure/* ]]; then
              shared=true
            fi
          done

          if [[ "$shared" == true ]]; then
            for file in infra/azure/environments/*/terraform.tfvars; do
              [[ -f "$file" ]] || continue
              rest="${file#infra/azure/environments/}"
              selected["${rest%%/*}"]=1
            done
          fi

          envs=()
          for name in "${!selected[@]}"; do
            [[ -f "infra/azure/environments/$name/terraform.tfvars" ]] || continue
            envs+=("$name")
          done

          if ((${#envs[@]})); then
            printf '%s\n' "${envs[@]}" | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))' > environments.json
          else
            echo '["__skip__"]' > environments.json
          fi

          echo "environments=$(cat environments.json)" >> "$GITHUB_OUTPUT"
          echo "Selected environments: $(cat environments.json)"

  deploy:
    name: Deploy ${{ matrix.environment }}
    needs: [validate, detect]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.detect.outputs.environments != '["__skip__"]'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: terraform-${{ matrix.environment }}
      cancel-in-progress: false

    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.detect.outputs.environments) }}

    defaults:
      run:
        working-directory: infra/azure

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: >-
          terraform init -input=false
          -backend-config="key=novacart-${{ matrix.environment }}.tfstate"

      - run: terraform validate

      - name: Terraform Plan
        run: >-
          terraform plan -input=false
          -var-file="environments/${{ matrix.environment }}/terraform.tfvars"
          -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan
