
name: Azure Infrastructure CD

on:
  pull_request:
    branches:
      - main
    paths:
      - "infra/azure/**"
      - ".github/workflows/azure-infra-cd.yml"

  push:
    branches:
      - main
    paths:
      - "infra/azure/**"
      - ".github/workflows/azure-infra-cd.yml"

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  validate:
    name: Terraform Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/azure

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        run: terraform validate

  detect:
    name: Detect Changed Environments
    runs-on: ubuntu-latest

    outputs:
      environments: ${{ steps.changed.outputs.all_changed_files }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Environment Directories
        id: changed
        uses: tj-actions/changed-files@v47
        with:
          path: infra/azure/environments
          diff_relative: true
          dir_names: true
          dir_names_max_depth: 1
          dir_names_exclude_current_dir: true
          matrix: true

  deploy:
    name: Deploy ${{ matrix.environment }}
    needs:
      - validate
      - detect

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.detect.outputs.environments != '[]' &&
      needs.detect.outputs.environments != ''

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: terraform-${{ matrix.environment }}
      cancel-in-progress: false

    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.detect.outputs.environments) }}

    defaults:
      run:
        working-directory: infra/azure

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: >-
          terraform init -input=false
          -backend-config="key=novacart-${{ matrix.environment }}.tfstate"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: >-
          terraform plan -input=false
          -var-file="environments/${{ matrix.environment }}/terraform.tfvars"
          -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan

