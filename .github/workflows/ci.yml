
name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: novacart/backend/requirements.txt

      - name: Install dependencies
        working-directory: novacart/backend
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx

      - name: Run backend tests
        working-directory: novacart/backend
        run: python -m pytest -q

      - name: Generate image tags
        if: github.event_name == 'push'
        run: |
          echo "VERSION=v1.0.${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login to Azure using OIDC
        if: github.event_name == 'push'
        continue-on-error: false
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

            - name: Build and push images to ACR
        if: success() && github.event_name == 'push'
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: |
          set -e

          ACR_SERVER=$(az acr show --name "$ACR_NAME" --query loginServer -o tsv)
          az acr login --name "$ACR_NAME"

          for APP in backend frontend; do
            docker build \
              --label org.opencontainers.image.revision="$GITHUB_SHA" \
              --label com.novacart.github.run-id="$GITHUB_RUN_ID" \
              -t "$ACR_SERVER/novocart-$APP:$VERSION" \
              -t "$ACR_SERVER/novocart-$APP:sha-$SHORT_SHA" \
              "./novacart/$APP"

            docker push "$ACR_SERVER/novocart-$APP:$VERSION"
            docker push "$ACR_SERVER/novocart-$APP:sha-$SHORT_SHA"
          done
      