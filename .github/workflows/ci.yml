name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test-build:
    name: Lint, Test and Application Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: novacart/backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install lint tool
        run: python -m pip install ruff

      - name: Run Python lint
        run: ruff check novacart/backend --ignore I001,UP017

      - name: Run JavaScript syntax check
        run: node --check novacart/frontend/app.js

      - name: Install backend dependencies
        working-directory: novacart/backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx

      - name: Run backend tests
        working-directory: novacart/backend
        run: python -m pytest tests -v

      - name: Validate backend application
        working-directory: novacart/backend
        run: |
          python -m compileall -q app
          python -c "import app.main"
          python -m pip check

      - name: Validate frontend files
        run: |
          test -f novacart/frontend/index.html
          test -f novacart/frontend/app.js
          test -f novacart/frontend/styles.css

  secret-scan:
    name: Secret Leak Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-build:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./novacart/backend
          file: ./novacart/backend/Dockerfile
          tags: novacart-backend:ci
          push: false
          load: true

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./novacart/frontend
          file: ./novacart/frontend/Dockerfile
          tags: novacart-frontend:ci
          push: false
          load: true

      - name: Validate Docker Compose configuration
        env:
          POSTGRES_USER: novacart
          POSTGRES_PASSWORD: novacart_local_only
          POSTGRES_DB: novacart
          NOVACART_TAG: ci
        run: docker compose config -q

      - name: Start NovaCart stack
        env:
          POSTGRES_USER: novacart
          POSTGRES_PASSWORD: novacart_local_only
          POSTGRES_DB: novacart
          NOVACART_TAG: ci
        run: docker compose up -d --wait

      - name: Smoke test application with curl
        shell: bash
        run: |
          echo "Checking NovaCart API..."

          for attempt in {1..10}; do
            if curl --fail --silent --show-error \
              --max-time 5 \
              http://localhost/api/products \
              --output products.json; then
              echo "SUCCESS: NovaCart API is responding."
              cat products.json
              exit 0
            fi

            echo "Attempt ${attempt}/10 failed."
            echo "Retrying in 3 seconds..."
            sleep 3
          done

          echo "FAILED: NovaCart API did not respond successfully."
          exit 1

      - name: Show service logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=100

      - name: Cleanup containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans

