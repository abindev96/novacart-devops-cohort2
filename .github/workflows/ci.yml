name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  precommittest:
    name: precommit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      
      - name: Checkout repository
        uses: actions/checkout@v4

      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: novacart/backend/requirements.txt

      
      - name: Install lint tool
        run: pip install ruff

      - name: Run Python lint
        run: ruff check novacart/backend --ignore I001

      - name: Run JavaScript syntax check
        run: node --check novacart/frontend/app.js

      
      - name: Install backend dependencies
        working-directory: novacart/backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx

      - name: Run backend tests
        working-directory: novacart/backend
        run: python -m pytest tests -v

      
      - name: Validate backend
        working-directory: novacart/backend
        run: |
          python -m compileall -q app
          python -c "import app.main"

      
      - name: Validate frontend files
        run: |
          test -f novacart/frontend/index.html
          test -f novacart/frontend/app.js
          test -f novacart/frontend/styles.css